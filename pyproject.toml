[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery-milestones"
version = "0.1.0"
description = "Delivery milestones: scope, roles, MVP modules, tech stack, phased timeline, risks and approvals"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
delivery-server = "delivery.server:main"

[tool.setuptools.packages.find]
include = ["delivery*", "tests*"]
