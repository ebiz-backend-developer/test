<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SchoolMS Dashboard</title>
<style>
  :root { --accent: #1b5e3b; --line: #d8dcd8; --bg: #f4f5f3; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Verdana, sans-serif;
         background: var(--bg); color: #1c1e1c; font-size: 14px; }
  header { background: var(--accent); color: #fff; padding: 10px 20px;
           display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .who { font-size: 13px; }
  header button { margin-left: 10px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 4px;
           padding: 6px 12px; cursor: pointer; font-size: 13px; }
  button.ghost { background: #fff; color: var(--accent);
                 border: 1px solid var(--accent); }
  nav { background: #fff; border-bottom: 1px solid var(--line); padding: 0 20px; }
  nav button { background: none; color: #333; border-radius: 0; padding: 10px 12px; }
  nav button.active { color: var(--accent); font-weight: 700;
                      border-bottom: 3px solid var(--accent); }
  main { padding: 20px; max-width: 1000px; }
  table { border-collapse: collapse; width: 100%; background: #fff; margin: 10px 0; }
  th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  th { background: #e9ece8; }
  form.inline { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0;
                background: #fff; padding: 12px; border: 1px solid var(--line); }
  form.inline input, form.inline select { padding: 6px; font-size: 13px;
                                          border: 1px solid var(--line); border-radius: 4px; }
  #login { max-width: 340px; margin: 80px auto; background: #fff; padding: 24px;
           border: 1px solid var(--line); }
  #login input { display: block; width: 100%; margin: 8px 0; padding: 8px;
                 border: 1px solid var(--line); border-radius: 4px; }
  .error { color: #a12622; margin: 8px 0; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; margin: 10px 0; }
  .card { background: #fff; border: 1px solid var(--line); padding: 12px 16px;
          min-width: 140px; }
  .card b { font-size: 22px; display: block; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 10px;
          font-size: 12px; background: #e6efe8; }
  .pill.delivered { background: #cfe5d4; }
</style>
</head>
<body>
<div id="login">
  <h2>SchoolMS sign in</h2>
  <p>Demo accounts: admin/admin123, teacher/teacher123, student/student123,
     parent/parent123, staff/staff123</p>
  <input id="username" placeholder="username" autocomplete="username">
  <input id="password" type="password" placeholder="password"
         autocomplete="current-password">
  <div class="error" id="loginError"></div>
  <button onclick="login()">Sign in</button>
</div>

<div id="app" style="display:none">
  <header>
    <h1>SchoolMS</h1>
    <div><span class="who" id="who"></span><button class="ghost"
        onclick="logout()">Sign out</button></div>
  </header>
  <nav id="tabs">
    <button data-tab="overview" class="active" onclick="show('overview')">Overview</button>
    <button data-tab="students" onclick="show('students')">Students</button>
    <button data-tab="teachers" onclick="show('teachers')">Teachers</button>
    <button data-tab="classes" onclick="show('classes')">Classes</button>
    <button data-tab="attendance" onclick="show('attendance')">Attendance</button>
    <button data-tab="grades" onclick="show('grades')">Grades</button>
    <button data-tab="fees" onclick="show('fees')">Fees</button>
    <button data-tab="milestones" onclick="show('milestones')">Milestones</button>
  </nav>
  <main id="main"></main>
</div>

<script>
let token = null, me = null;
const main = document.getElementById('main');

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { 'Content-Type': 'application/json',
               'Authorization': 'Bearer ' + token },
    body: body ? JSON.stringify(body) : undefined
  });
  if (res.status === 204) return null;
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}

async function login() {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  try {
    const res = await fetch('/api/login', { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    token = data.token; me = data.user;
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('who').textContent =
      me.username + ' (' + me.role + ')';
    show('overview');
  } catch (e) {
    document.getElementById('loginError').textContent = e.message;
  }
}

async function logout() {
  try { await api('POST', '/api/logout'); } catch (e) {}
  token = null; location.reload();
}

function show(tab) {
  document.querySelectorAll('#tabs button').forEach(
    b => b.classList.toggle('active', b.dataset.tab === tab));
  ({ overview: vOverview, students: vStudents, teachers: vTeachers,
     classes: vClasses, attendance: vAttendance, grades: vGrades,
     fees: vFees, milestones: vMilestones })[tab]();
}

function esc(s) { return String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function tbl(heads, rows) {
  return '<table><tr>' + heads.map(h => '<th>' + h + '</th>').join('') +
    '</tr>' + rows.map(r => '<tr>' + r.map(
      c => '<td>' + esc(c) + '</td>').join('') + '</tr>').join('') + '</table>';
}
function onErr(e) { main.innerHTML = '<p class="error">' + esc(e.message) + '</p>'; }

async function vOverview() {
  try {
    const o = await api('GET', '/api/reports/overview');
    const rev = await api('GET', '/api/reports/revenue').catch(() => null);
    main.innerHTML =
      '<div class="cards">' +
      '<div class="card"><b>' + o.students + '</b>students</div>' +
      '<div class="card"><b>' + o.teachers + '</b>teachers</div>' +
      '<div class="card"><b>' + o.classes + '</b>classes</div>' +
      '<div class="card"><b>' + o.enrollments + '</b>enrollments</div>' +
      (rev ? '<div class="card"><b>$' + rev.collected + '</b>fees collected</div>' +
             '<div class="card"><b>$' + rev.outstanding + '</b>outstanding</div>' : '') +
      '</div><p>Milestones delivered: ' + o.progress.milestones_delivered +
      ' of ' + o.progress.milestones_total + ' (' + o.progress.percent + '%).</p>';
  } catch (e) { onErr(e); }
}

async function vStudents() {
  try {
    const d = await api('GET', '/api/students');
    main.innerHTML =
      '<form class="inline" onsubmit="return addStudent(event)">' +
      '<input name="first_name" placeholder="First name" required>' +
      '<input name="last_name" placeholder="Last name" required>' +
      '<input name="email" placeholder="Email" required>' +
      '<input name="grade_level" type="number" min="1" max="12" placeholder="Grade" required>' +
      '<button>Add student</button></form>' +
      tbl(['Name', 'Email', 'Grade', 'Active'],
        d.students.map(s => [s.first_name + ' ' + s.last_name, s.email,
                              s.grade_level, s.active]));
  } catch (e) { onErr(e); }
}
async function addStudent(ev) {
  ev.preventDefault();
  const f = new FormData(ev.target);
  try {
    await api('POST', '/api/students',
      { first_name: f.get('first_name'), last_name: f.get('last_name'),
        email: f.get('email'), grade_level: Number(f.get('grade_level')) });
    vStudents();
  } catch (e) { alert(e.message); }
  return false;
}

async function vTeachers() {
  try {
    const d = await api('GET', '/api/teachers');
    main.innerHTML =
      '<form class="inline" onsubmit="return addTeacher(event)">' +
      '<input name="first_name" placeholder="First name" required>' +
      '<input name="last_name" placeholder="Last name" required>' +
      '<input name="email" placeholder="Email" required>' +
      '<input name="subject" placeholder="Subject" required>' +
      '<button>Add teacher</button></form>' +
      tbl(['Name', 'Email', 'Subject'],
        d.teachers.map(t => [t.first_name + ' ' + t.last_name, t.email, t.subject]));
  } catch (e) { onErr(e); }
}
async function addTeacher(ev) {
  ev.preventDefault();
  const f = new FormData(ev.target);
  try {
    await api('POST', '/api/teachers',
      { first_name: f.get('first_name'), last_name: f.get('last_name'),
        email: f.get('email'), subject: f.get('subject') });
    vTeachers();
  } catch (e) { alert(e.message); }
  return false;
}

async function vClasses() {
  try {
    const d = await api('GET', '/api/classes');
    const t = await api('GET', '/api/teachers').catch(() => ({ teachers: [] }));
    const opts = t.teachers.map(x =>
      '<option value="' + x.id + '">' + esc(x.first_name + ' ' + x.last_name) + '</option>').join('');
    main.innerHTML =
      '<form class="inline" onsubmit="return addClass(event)">' +
      '<input name="name" placeholder="Class name" required>' +
      '<input name="grade_level" type="number" min="1" max="12" placeholder="Grade" required>' +
      '<select name="teacher_id">' + opts + '</select>' +
      '<input name="room" placeholder="Room">' +
      '<button>Add class</button></form>' +
      tbl(['Name', 'Grade', 'Room', 'Capacity'],
        d.classes.map(c => [c.name, c.grade_level, c.room, c.capacity])) +
      '<h3>Enroll a student</h3>' +
      '<form class="inline" onsubmit="return enroll(event)">' +
      '<input name="student_id" placeholder="Student id" required>' +
      '<input name="class_id" placeholder="Class id" required>' +
      '<button>Enroll</button></form>';
  } catch (e) { onErr(e); }
}
async function addClass(ev) {
  ev.preventDefault();
  const f = new FormData(ev.target);
  try {
    await api('POST', '/api/classes',
      { name: f.get('name'), grade_level: Number(f.get('grade_level')),
        teacher_id: f.get('teacher_id'), room: f.get('room') });
    vClasses();
  } catch (e) { alert(e.message); }
  return false;
}
async function enroll(ev) {
  ev.preventDefault();
  const f = new FormData(ev.target);
  try {
    await api('POST', '/api/enrollments',
      { student_id: f.get('student_id'), class_id: f.get('class_id') });
    alert('Enrolled.');
  } catch (e) { alert(e.message); }
  return false;
}

async function vAttendance() {
  try {
    const d = await api('GET', '/api/attendance');
    const rows = Object.entries(d.summary).map(([sid, s]) =>
      [sid, s.present, s.absent, s.late, s.excused, s.attendance_rate + '%']);
    main.innerHTML =
      '<form class="inline" onsubmit="return markAtt(event)">' +
      '<input name="student_id" placeholder="Student id" required>' +
      '<input name="class_id" placeholder="Class id" required>' +
      '<input name="day" type="date" required>' +
      '<select name="status"><option>present</option><option>absent</option>' +
      '<option>late</option><option>excused</option></select>' +
      '<button>Mark</button></form>' +
      tbl(['Student', 'Present', 'Absent', 'Late', 'Excused', 'Rate'], rows);
  } catch (e) { onErr(e); }
}
async function markAtt(ev) {
  ev.preventDefault();
  const f = new FormData(ev.target);
  try {
    await api('POST', '/api/attendance',
      { student_id: f.get('student_id'), class_id: f.get('class_id'),
        day: f.get('day'), status: f.get('status') });
    vAttendance();
  } catch (e) { alert(e.message); }
  return false;
}

async function vGrades() {
  const sid = me.role === 'student' || me.role === 'parent' ? me.link_id : '';
  try {
    let html =
      '<form class="inline" onsubmit="return recordGrade(event)">' +
      '<input name="student_id" placeholder="Student id" value="' + esc(sid) + '" required>' +
      '<input name="class_id" placeholder="Class id" required>' +
      '<input name="assignment" placeholder="Assignment" required>' +
      '<input name="score" type="number" step="0.5" placeholder="Score" required>' +
      '<button>Record grade</button></form>';
    if (sid) {
      const d = await api('GET', '/api/grades?student_id=' + sid);
      html += '<p>GPA: <b>' + d.gpa.gpa + '</b> (' + d.gpa.average_percent +
        '% over ' + d.gpa.assignments + ' assignments)</p>' +
        tbl(['Assignment', 'Score', 'Max'],
          d.grades.map(g => [g.assignment, g.score, g.max_score]));
    } else {
      html += '<p>Enter a student id above to record; GPA lookup ' +
        'is available on student/parent accounts.</p>';
    }
    main.innerHTML = html;
  } catch (e) { onErr(e); }
}
async function recordGrade(ev) {
  ev.preventDefault();
  const f = new FormData(ev.target);
  try {
    await api('POST', '/api/grades',
      { student_id: f.get('student_id'), class_id: f.get('class_id'),
        assignment: f.get('assignment'), score: Number(f.get('score')) });
    vGrades();
  } catch (e) { alert(e.message); }
  return false;
}

async function vFees() {
  const sid = me.role === 'student' || me.role === 'parent' ? me.link_id : '';
  try {
    let html =
      '<form class="inline" onsubmit="return issueFee(event)">' +
      '<input name="student_id" placeholder="Student id" required>' +
      '<input name="title" placeholder="Title" required>' +
      '<input name="amount" type="number" step="0.01" placeholder="Amount" required>' +
      '<input name="due_date" type="date" required>' +
      '<button>Issue invoice</button></form>';
    if (sid) {
      const d = await api('GET', '/api/fees?student_id=' + sid);
      html += '<p>Total due: <b>$' + d.total_due + '</b></p>' +
        tbl(['Title', 'Amount', 'Paid', 'Balance', 'Status', 'Due'],
          d.invoices.map(i => [i.title, i.amount, i.paid, i.balance, i.status, i.due_date]));
    } else {
      html += '<p>Invoices are listed on the student/parent account.</p>';
    }
    main.innerHTML = html;
  } catch (e) { onErr(e); }
}
async function issueFee(ev) {
  ev.preventDefault();
  const f = new FormData(ev.target);
  try {
    await api('POST', '/api/fees',
      { student_id: f.get('student_id'), title: f.get('title'),
        amount: Number(f.get('amount')), due_date: f.get('due_date') });
    vFees();
  } catch (e) { alert(e.message); }
  return false;
}

async function vMilestones() {
  try {
    const p = await api('GET', '/api/milestones');
    main.innerHTML = '<p>' + p.milestones_delivered + ' of ' +
      p.milestones_total + ' milestones delivered (' + p.percent +
      '%). All approved: ' + p.all_approved + '.</p>' +
      tbl(['ID', 'Title', 'Status', 'Modules'],
        p.milestones.map(m => [m.id, m.title,
          m.status, m.delivered_modules.join(', ') || '-']));
  } catch (e) { onErr(e); }
}
</script>
</body>
</html>
