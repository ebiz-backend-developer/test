<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milestones — Design Hub</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html">Design <span>Hub</span></a>
  <span class="spacer"></span>
</header>
<div class="layout">
  <nav class="sidenav" data-nav></nav>
  <main>
    <h1>Delivery milestones</h1>
    <p class="lede">Criterion c4: draft → proposed → approved. PMs propose;
    only admins and stakeholders approve or reject, with an audit trail.</p>
    <div id="savewarn" class="notice error" hidden></div>
    <div id="msg" class="notice" hidden></div>
    <div id="milestones"></div>
    <h2>New milestone</h2>
    <form class="panel" id="addform">
      <label for="f-title">Title</label>
      <input type="text" id="f-title" required maxlength="200">
      <label for="f-due">Due date</label>
      <input type="date" id="f-due">
      <label for="f-desc">Description</label>
      <textarea id="f-desc"></textarea>
      <p><button type="submit">Create draft</button></p>
    </form>
  </main>
</div>
<nav class="bottomnav" data-nav></nav>
<script src="js/app.js"></script>
<script>
Hub.mountChrome("milestones.html");
function load() {
  Hub.api("/api/milestones").then(function (items) {
    var html = "<table><thead><tr><th>Milestone</th><th>Status</th><th>Decision</th><th>Actions</th></tr></thead><tbody>";
    items.forEach(function (m) {
      var dec = m.status === "approved"
        ? "by " + Hub.esc(m.approved_by) + " at " + Hub.esc(m.approved_at)
        : m.status === "rejected" ? "by " + Hub.esc(m.decided_by) : "—";
      html += "<tr><td><b>" + Hub.esc(m.title) + "</b><br><small>Due " +
        Hub.esc(m.due_date || "—") + " · " + Hub.esc(m.description) + "</small></td><td>" +
        Hub.badge(m.status, m.status === "approved" ? "ok" : m.status === "proposed" ? "p1" : "dim") +
        "</td><td><small>" + dec + "</small></td><td>" +
        "<button class='secondary' data-act='submit' data-id='" + m.id + "'>Submit</button> " +
        "<button data-act='approve' data-id='" + m.id + "'>Approve</button> " +
        "<button class='danger' data-act='reject' data-id='" + m.id + "'>Reject</button></td></tr>";
    });
    var el = document.getElementById("milestones");
    el.innerHTML = html + "</tbody></table>";
    el.querySelectorAll("button").forEach(function (b) {
      b.addEventListener("click", function () {
        Hub.api("/api/milestones/" + b.dataset.id + "/" + b.dataset.act, {method: "POST", body: {}})
          .then(function () { Hub.notice(document.getElementById("msg"), "Milestone updated.", "ok"); load(); })
          .catch(function (e) { Hub.notice(document.getElementById("msg"), e.message, "error"); });
      });
    });
  }).catch(function (e) { Hub.notice(document.getElementById("msg"), e.message, "error"); });
}
document.getElementById("addform").addEventListener("submit", function (ev) {
  ev.preventDefault();
  Hub.api("/api/milestones", {method: "POST", body: {
    title: document.getElementById("f-title").value,
    due_date: document.getElementById("f-due").value,
    description: document.getElementById("f-desc").value
  }}).then(function () {
    Hub.notice(document.getElementById("msg"), "Draft created.", "ok");
    ev.target.reset(); load();
  }).catch(function (e) { Hub.notice(document.getElementById("msg"), e.message, "error"); });
});
load();
</script>
</body>
</html>
